<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <g id="cam">
      <rect x="14" y="40" width="94" height="80" rx="14"/>
      <polygon points="106,66 146,42 146,118 106,94"/>
    </g>
    <clipPath id="camClip"><use href="#cam"/></clipPath>
    <clipPath id="dotClip"><circle cx="61" cy="80" r="18"/></clipPath>
  </defs>
  <!-- drop shadow -->
  <use href="#cam" transform="translate(5 6)" fill="#000" fill-opacity="0.35" stroke="#000" stroke-opacity="0.35" stroke-width="12" stroke-linejoin="round"/>
  <!-- outline + two-tone fill -->
  <use href="#cam" fill="#ffffff" stroke="#000" stroke-width="12" stroke-linejoin="round"/>
  <rect x="0" y="82" width="160" height="80" fill="#c8c8c8" clip-path="url(#camClip)"/>
  <!-- record light -->
  <circle cx="61" cy="80" r="18" fill="#e82a2a" stroke="#000" stroke-width="8"/>
  <rect x="40" y="58" width="44" height="21" fill="#ff5c5c" clip-path="url(#dotClip)"/>
  <circle cx="61" cy="80" r="18" fill="none" stroke="#000" stroke-width="8"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
